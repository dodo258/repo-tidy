name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false  # 只用标准库，没有 go.sum
      - run: go test -count=1 ./...
      - name: 编四个平台
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}
            dir=$(mktemp -d)
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$version" -o "$dir/repo-tidy" ./cmd/repo-tidy
            cp LICENSE README.md README.en.md "$dir/"
            tar -czf "dist/repo-tidy_${os}_${arch}.tar.gz" -C "$dir" repo-tidy LICENSE README.md README.en.md
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: 发 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=docs/releases/$GITHUB_REF_NAME.md
          [ -f "$notes" ] || { echo "缺 $notes"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file "$notes" --verify-tag
