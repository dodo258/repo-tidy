name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "没格式化：$out"; exit 1; fi
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
      - run: go build -o bin/repo-tidy ./cmd/repo-tidy
      - name: Mac App 构建和测试
        working-directory: mac
        run: |
          swift build
          REPO_TIDY_BIN="$PWD/../bin/repo-tidy" swift test
          scripts/build-app.sh
